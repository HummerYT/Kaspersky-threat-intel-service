services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: threats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threats}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threats -d threats"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://threats:${POSTGRES_PASSWORD:-threats}@postgres:5432/threats?sslmode=disable
      API_KEY: ${API_KEY:-}
      RATE_LIMIT: ${RATE_LIMIT:-120}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
